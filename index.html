<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1024" />
<title>네온 닷지 - 장애물 피하기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#1f2a59,#0b1024 65%);color:#fff;display:flex;align-items:center;justify-content:center;padding:14px;overscroll-behavior:none}.app{width:min(100%,460px)}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px;gap:12px}h1{font-size:24px;letter-spacing:.05em;margin:0}.sub{font-size:12px;color:#aab5d5;margin:4px 0 0}.scores{display:flex;gap:14px;font-size:12px;color:#b5c1e6;text-align:right}.scores strong{display:block;color:white;font-size:23px;font-variant-numeric:tabular-nums}.frame{position:relative;overflow:hidden;border:1px solid #394472;border-radius:18px;box-shadow:0 20px 55px #0008;background:#0c1431;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#070c20b9;backdrop-filter:blur(4px);padding:24px;text-align:center}.overlay.hidden{display:none}.panel{max-width:310px}.panel h2{font-size:30px;margin:0 0 9px}.panel p{line-height:1.55;color:#c3ccee;margin:0 0 21px}.button{border:0;color:#0b1024;background:#66f5df;font-weight:800;border-radius:12px;padding:13px 28px;font-size:16px;cursor:pointer;min-height:46px}.button:focus-visible,.small:focus-visible{outline:3px solid white;outline-offset:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:11px;gap:8px;color:#bdc7e5;font-size:13px}.small{border:1px solid #52618f;background:#1c2a53;color:#fff;border-radius:10px;padding:10px 15px;cursor:pointer;min-height:42px}footer{color:#909fc6;text-align:center;font-size:12px;margin:12px 0 0;line-height:1.6}@media(max-width:390px){h1{font-size:21px}.scores{gap:8px}.scores strong{font-size:20px}}@media(max-height:680px){body{align-items:flex-start}canvas{max-height:70dvh}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>⚡ 네온 닷지</h1><p class="sub">장애물을 피해 오래 살아남으세요</p></div><div class="scores"><div>점수<strong id="score">0</strong></div><div>최고<strong id="best">0</strong></div></div></header>
<div class="frame" id="frame"><canvas id="game" width="360" height="480" aria-label="장애물 피하기 게임"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="overlayTitle">네온 닷지</h2><p id="overlayText">빨간 장애물을 피하세요!<br>PC: ← → 또는 A / D<br>모바일: 화면을 터치하거나 드래그</p><button id="start" class="button">게임 시작</button></div></div></div>
<div class="toolbar"><span id="status">준비 완료</span><button class="small" id="pause" disabled>일시정지</button></div><footer>설치 · 로그인 · AI 호출 없음 · 기록은 이 기기에 저장됩니다</footer>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText'),startButton=document.getElementById('start'),pauseButton=document.getElementById('pause'),statusEl=document.getElementById('status');
const W=360,H=480,player={x:180,y:423,r:13},keys={left:false,right:false};let obstacles=[],stars=[],score=0,best=0,elapsed=0,spawnTimer=0,last=0,raf=0,state='ready',pointerActive=false;
try{best=Number(localStorage.getItem('neon-dodge-best'))||0}catch(e){}bestEl.textContent=best;
for(let i=0;i<48;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,s:12+Math.random()*23});
function reset(){obstacles=[];score=0;elapsed=0;spawnTimer=.5;player.x=W/2;scoreEl.textContent='0';keys.left=keys.right=false;pointerActive=false}
function start(){reset();state='running';overlay.classList.add('hidden');pauseButton.disabled=false;pauseButton.textContent='일시정지';statusEl.textContent='플레이 중';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function pause(){if(state==='running'){state='paused';overlayTitle.textContent='일시정지';overlayText.textContent='계속하려면 아래 버튼을 누르세요.';startButton.textContent='계속하기';overlay.classList.remove('hidden');pauseButton.textContent='계속';statusEl.textContent='일시정지';cancelAnimationFrame(raf)}else if(state==='paused')resume()}
function resume(){state='running';overlay.classList.add('hidden');pauseButton.textContent='일시정지';statusEl.textContent='플레이 중';last=performance.now();raf=requestAnimationFrame(loop)}
function gameOver(){state='over';cancelAnimationFrame(raf);pauseButton.disabled=true;statusEl.textContent='게임 종료';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neon-dodge-best',String(best))}catch(e){}}overlayTitle.textContent='게임 오버!';overlayText.textContent=`최종 점수: ${score}점 · 최고 기록: ${best}점`;startButton.textContent='다시 시작';overlay.classList.remove('hidden')}
function spawn(){const w=26+Math.random()*30;obstacles.push({x:8+Math.random()*(W-w-16),y:-35,w,h:17+Math.random()*19,speed:155+elapsed*5+Math.random()*65})}
function update(dt){elapsed+=dt;const speed=250;if(!pointerActive){if(keys.left)player.x-=speed*dt;if(keys.right)player.x+=speed*dt}player.x=Math.max(player.r+5,Math.min(W-player.r-5,player.x));spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.27,.80-elapsed*.009)*(0.8+Math.random()*.4)}for(const s of stars){s.y+=s.s*dt;if(s.y>H)s.y=0}for(const o of obstacles){o.y+=o.speed*dt;const nearestX=Math.max(o.x,Math.min(player.x,o.x+o.w)),nearestY=Math.max(o.y,Math.min(player.y,o.y+o.h));if((nearestX-player.x)**2+(nearestY-player.y)**2<(player.r-2)**2){gameOver();return}}obstacles=obstacles.filter(o=>o.y<H+45);const next=Math.floor(elapsed*10);if(next!==score){score=next;scoreEl.textContent=score}}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,W,H);const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#101c44');grd.addColorStop(1,'#0a1026');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#24345b';ctx.lineWidth=1;for(let x=30;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(elapsed*30)%60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const s of stars){ctx.fillStyle='#8da9df88';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}for(const o of obstacles){ctx.shadowBlur=16;ctx.shadowColor='#ff456c';ctx.fillStyle='#fb4f79';roundedRect(o.x,o.y,o.w,o.h,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd2df';ctx.fillRect(o.x+5,o.y+5,Math.max(0,o.w-10),2)}ctx.shadowBlur=22;ctx.shadowColor='#52f9e4';ctx.fillStyle='#60f5e2';ctx.beginPath();ctx.moveTo(player.x,player.y-player.r-5);ctx.lineTo(player.x-player.r,player.y+player.r);ctx.lineTo(player.x+player.r,player.y+player.r);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0c3950';ctx.beginPath();ctx.moveTo(player.x,player.y-9);ctx.lineTo(player.x-5,player.y+6);ctx.lineTo(player.x+5,player.y+6);ctx.fill()}
function loop(now){if(state!=='running')return;const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();if(state==='running')raf=requestAnimationFrame(loop)}
function setPointer(e){const rect=canvas.getBoundingClientRect();player.x=Math.max(player.r+5,Math.min(W-player.r-5,(e.clientX-rect.left)*W/rect.width))}
canvas.addEventListener('pointerdown',e=>{if(state!=='running')return;pointerActive=true;setPointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointerActive&&state==='running')setPointer(e)});function release(){pointerActive=false}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d','p'].includes(key))e.preventDefault();if(key==='arrowleft'||key==='a')keys.left=true;if(key==='arrowright'||key==='d')keys.right=true;if((key==='p'||key===' ')&& !e.repeat &&(state==='running'||state==='paused'))pause()});window.addEventListener('keyup',e=>{const key=e.key.toLowerCase();if(key==='arrowleft'||key==='a')keys.left=false;if(key==='arrowright'||key==='d')keys.right=false});window.addEventListener('blur',()=>{if(state==='running')pause()});
startButton.addEventListener('click',()=>state==='paused'?resume():start());pauseButton.addEventListener('click',pause);draw();
})();
</script>
</body>
</html>
